[General parameters]

# Fixed seed for reproducible experimental comparisons.
rnd_seed     = 42
verbose      = 1
parallel     = False
processes    = None
numpy_multi  = True


[Input file's data columns]

# Gaia DR3-style column names used by the experimental branch.
ID           = None
xy_coords    = ra  dec
data         = pmra  pmdec  parallax
uncert       = pmra_error pmdec_error parallax_error

oultr_method   = stdregion
stdRegion_nstd = 5.


[Outer loop]

OL_runs      = 25

# Uncertainties are still read when False because the experimental
# heteroscedastic GUMM uses them directly.
resampleFlag = False

# Keep the GUMM in the native standardized (pmra, pmdec, parallax) basis so
# observational errors are not mixed with an unpropagated PCA transform.
PCAflag      = False
PCAdims      = 3

GUMM_flag    = True
GUMM_perc    = auto
KDEP_flag    = True


[Inner loop]

IL_runs    = 25
N_membs    = 25
N_cl_max   = 1000
clust_method = HDBSCAN


[Clustering parameters]

# First smoke-test settings. min_cluster_size is tied to the pyUPMASK
# N_membs scale; min_samples is kept smaller so the first HDBSCAN pass does
# not collapse a moderately contaminated field into all-noise. These are
# experimental settings, not yet science-calibrated defaults.
min_cluster_size = int_25
min_samples      = int_5
